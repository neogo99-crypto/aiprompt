<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional YouTube Ad-Minimized Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-hover: #0052a3;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border-color: #e1e4e8;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 35px; }
        header h1 { font-size: 2rem; font-weight: 600; margin-bottom: 8px; }
        header p { color: var(--text-muted); font-size: 0.95rem; }
        
        .main-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; }
        
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: vertical;
            background-color: #fdfdfd;
        }
        textarea:focus { outline: none; border-color: var(--primary-color); background-color: #fff; }
        
        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-submit:hover { background-color: var(--primary-hover); }
        
        .player-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            display: none;
        }
        .player-title {
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #28a745;
            border-radius: 50%;
        }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            background-color: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        .error-message { color: #dc3545; font-size: 0.85rem; margin-top: 5px; display: none; }
        .info-tag {
            display: inline-block;
            background-color: #e6f2ff;
            color: #0066cc;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>YouTube Clean Video Player</h1>
            <p>แปลงโค้ดฝังเพื่อลดโฆษณา คั่นเนื้อหา และเพิ่มความเป็นส่วนตัวสูงสุด</p>
        </header>

        <main>
            <div class="main-card">
                <div class="form-group">
                    <label for="iframeInput">โค้ด iframe ดั้งเดิมจาก YouTube</label>
                    <textarea id="iframeInput" placeholder='วางโค้ด <iframe ...> ที่คัดลอกมาจาก YouTube ที่นี่'></textarea>
                    <div id="errorMessage" class="error-message">โปรดระบุโค้ด iframe ที่ถูกต้อง</div>
                </div>
                <button type="button" class="btn-submit" onclick="renderCleanVideo()">เปิดเครื่องเล่นแบบคลีน (Run Clean Player)</button>
            </div>

            <div id="playerWrapper" class="player-wrapper">
                <div class="player-title">
                    กำลังเล่นในโหมดเพิ่มความเป็นส่วนตัว (No-Cookie Mode)
                </div>
                <div id="videoContainer" class="video-container"></div>
                <div class="info-tag">🛡️ ระบบทำการกรอง URL และฝังพารามิเตอร์ป้องกันโฆษณาเบื้องต้นให้แล้ว</div>
            </div>
        </main>
    </div>

    <script>
        function renderCleanVideo() {
            const inputArea = document.getElementById('iframeInput');
            const errorMsg = document.getElementById('errorMessage');
            const playerWrapper = document.getElementById('playerWrapper');
            const videoContainer = document.getElementById('videoContainer');
            
            let rawCode = inputArea.value.trim();

            if (rawCode === "" || !rawCode.includes('<iframe') || !rawCode.includes('src')) {
                errorMsg.style.display = 'block';
                playerWrapper.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';

            try {
                // สร้างธาตุเสมือนขึ้นมาดึงค่า src เพื่อแปลง url
                const parser = new DOMParser();
                const doc = parser.parseFromString(rawCode, 'text/html');
                const iframe = doc.querySelector('iframe');
                
                if (iframe) {
                    let src = iframe.getAttribute('src');
                    
                    // 1. เปลี่ยนโดเมนเพื่อเลี่ยงคุ้กกี้โฆษณาพฤติกรรม
                    src = src.replace('youtube.com', 'youtube-nocookie.com');
                    src = src.replace('youtu.be', 'youtube-nocookie.com');
                    
                    // 2. เติมพารามิเตอร์ลดการโฆษณาและปิดสิ่งกวนใจ
                    const urlObj = new URL(src);
                    urlObj.searchParams.set('rel', '0');             // โชว์เฉพาะวิดีโอที่เกี่ยวข้องในช่องตัวเองตอนจบ
                    urlObj.searchParams.set('iv_load_policy', '3');  // ปิด Annotations กวนใจบนจอ
                    urlObj.searchParams.set('modestbranding', '1');  // ลดการแสดงโลโก้ YouTube ขนาดใหญ่
                    
                    // ตั้งค่าคุณสมบัติความปลอดภัยเพิ่มเติมให้กับ iframe
                    iframe.setAttribute('src', urlObj.toString());
                    iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                    
                    // แสดงผล
                    videoContainer.innerHTML = iframe.outerHTML;
                    playerWrapper.style.display = 'block';
                    playerWrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    throw new Error("Invalid iframe structures");
                }
            } catch (e) {
                errorMsg.innerText = "เกิดข้อผิดพลาดในการประมวลผลโค้ด iframe";
                errorMsg.style.display = 'block';
                playerWrapper.style.display = 'none';
            }
        }
    </script>
</body>
</html>
