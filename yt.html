<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional YouTube URL & iFrame Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-hover: #0052a3;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border-color: #e1e4e8;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 35px; }
        header h1 { font-size: 2rem; font-weight: 600; margin-bottom: 8px; }
        header p { color: var(--text-muted); font-size: 0.95rem; }
        
        .main-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; }
        
        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: vertical;
            background-color: #fdfdfd;
        }
        textarea:focus { outline: none; border-color: var(--primary-color); background-color: #fff; }
        
        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-submit:hover { background-color: var(--primary-hover); }
        
        .player-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            display: none;
        }
        .player-title {
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #28a745;
            border-radius: 50%;
        }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            background-color: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        .error-message { color: #dc3545; font-size: 0.85rem; margin-top: 5px; display: none; }
        .info-tag {
            display: inline-block;
            background-color: #e6f2ff;
            color: #0066cc;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>YouTube Clean Video Player</h1>
            <p>วางเฉพาะลิงก์บรรทัด src หรือโค้ด iframe เต็มรูปแบบเพื่อเปิดวิดีโอโหมดลดโฆษณา</p>
        </header>

        <main>
            <div class="main-card">
                <div class="form-group">
                    <label for="videoInput">ลิงก์วิดีโอ (เฉพาะส่วน src) หรือ โค้ด iframe</label>
                    <textarea id="videoInput" placeholder='ตัวอย่าง: https://www.youtube.com/embed/nm3jDf4ofTo?si=y5aitIfXlzkssAao'></textarea>
                    <div id="errorMessage" class="error-message">โปรดระบุที่อยู่ลิงก์หรือโค้ดวิดีโอที่ถูกต้อง</div>
                </div>
                <button type="button" class="btn-submit" onclick="processAndRender()">เปิดเครื่องเล่นวิดีโอ (Run Player)</button>
            </div>

            <div id="playerWrapper" class="player-wrapper">
                <div class="player-title">กำลังเล่นในโหมดเพิ่มความเป็นส่วนตัว (No-Cookie Mode)</div>
                <div id="videoContainer" class="video-container"></div>
                <div class="info-tag">🛡️ ปรับเปลี่ยนลิงก์เป็นรูปแบบไร้คุ้กกี้โฆษณาและปิดสิ่งกวนใจให้เรียบร้อยแล้ว</div>
            </div>
        </main>
    </div>

    <script>
        function processAndRender() {
            const inputArea = document.getElementById('videoInput');
            const errorMsg = document.getElementById('errorMessage');
            const playerWrapper = document.getElementById('playerWrapper');
            const videoContainer = document.getElementById('videoContainer');
            
            let inputValue = inputArea.value.trim();
            let finalSrc = "";

            if (inputValue === "") {
                errorMsg.style.display = 'block';
                playerWrapper.style.display = 'none';
                return;
            }

            // เคสที่ 1: ผู้ใช้วางมาเป็นโค้ด iframe เต็มๆ (เช่น <iframe src="..." ...>)
            if (inputValue.includes('<iframe')) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(inputValue, 'text/html');
                const iframe = doc.querySelector('iframe');
                if (iframe && iframe.getAttribute('src')) {
                    finalSrc = iframe.getAttribute('src');
                }
            } else {
                // เคสที่ 2: ผู้ใช้วางเฉพาะตัวลิงก์ (ทั้งแบบมีหรือไม่มีเครื่องหมายคำพูดครอบ)
                // ตัดเครื่องหมายคำพูดออกในกรณีที่ติดมา เช่น src="http..." หรือ "http..."
                finalSrc = inputValue.replace(/^(src=)?['"‘“]|['"’”]$/g, '').trim();
            }

            // ตรวจสอบความถูกต้องเบื้องต้นของ URL ลิงก์ YouTube
            if (finalSrc === "" || (!finalSrc.includes('youtube') && !finalSrc.includes('youtu.be'))) {
                errorMsg.style.display = 'block';
                playerWrapper.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';

            try {
                // 1. แปลง Domain เพื่อหลีกเลี่ยงการจำประวัติและคุ้กกี้ที่ส่งผลต่อโฆษณา
                finalSrc = finalSrc.replace('youtube.com', 'youtube-nocookie.com');
                finalSrc = finalSrc.replace('youtu.be', 'youtube-nocookie.com');
                
                // 2. เติม Parameter เพื่อบล็อกและจำกัดสิ่งกวนใจ
                const urlObj = new URL(finalSrc);
                urlObj.searchParams.set('rel', '0');             // แสดงแค่วิดีโอจากช่องเดียวกันตอนเล่นจบ
                urlObj.searchParams.set('iv_load_policy', '3');  // ปิด Annotations/แถบอักษรโปรโมตบนจอ
                urlObj.searchParams.set('modestbranding', '1');  // ลดโลโก้ YouTube ตัวใหญ่

                // 3. สร้างแท็ก iframe ขึ้นมาใหม่ด้วยโครงสร้างที่ปลอดภัยและสมบูรณ์
                const cleanIframe = document.createElement('iframe');
                cleanIframe.setAttribute('src', urlObj.toString());
                cleanIframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                cleanIframe.setAttribute('allowfullscreen', 'true');

                // ทำการแสดงผลบนหน้าเว็บ
                videoContainer.innerHTML = '';
                videoContainer.appendChild(cleanIframe);
                playerWrapper.style.display = 'block';
                playerWrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (e) {
                errorMsg.innerText = "ลิงก์ URL ไม่ถูกต้องตามรูปแบบมาตรฐาน";
                errorMsg.style.display = 'block';
                playerWrapper.style.display = 'none';
            }
        }
    </script>
</body>
</html>
