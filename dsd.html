<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบหลักสูตรฝึกอบรม DSD</title>
    
    <!-- นำเข้า Google Fonts (Sarabun) เพื่อความสวยงามแบบไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- นำเข้า Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f2f5;
            padding-top: 50px;
            padding-bottom: 50px;
        }
        .container {
            max-width: 1100px;
        }
        .main-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: #ffffff;
            padding: 30px;
        }
        .header-title {
            color: #0d6efd;
            font-weight: 600;
            border-left: 5px solid #0d6efd;
            padding-left: 15px;
            margin-bottom: 25px;
        }
        .table thead {
            background-color: #0d6efd;
            color: white;
        }
        .status-badge {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-block;
        }
        #loader {
            display: none;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="header-title mb-0">ค้นหาหลักสูตรที่ยังว่าง (กรมพัฒนาฝีมือแรงงาน)</h2>
            <button id="fetchBtn" class="btn btn-primary btn-lg shadow-sm">
                <span id="btnText">ดึงข้อมูลล่าสุด</span>
                <span id="loader" class="spinner-border spinner-border-sm ms-2" role="status"></span>
            </button>
        </div>
        <p class="text-muted mb-4">แสดงเฉพาะหลักสูตรที่สถานะเป็น "สมัครได้" เท่านั้น</p>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="courseTable">
                <thead>
                    <tr>
                        <th width="5%">#</th>
                        <th width="40%">ชื่อหลักสูตร / สาขา</th>
                        <th width="25%">หน่วยงาน</th>
                        <th width="15%">ระยะเวลาฝึก</th>
                        <th width="15%">สถานะ</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- ข้อมูลจะถูกเติมที่นี่ -->
                </tbody>
            </table>
            <div id="noData" class="empty-state">
                <p>กดปุ่ม "ดึงข้อมูลล่าสุด" เพื่อเริ่มการค้นหา</p>
            </div>
        </div>
    </div>
    
    <footer class="mt-4 text-center text-muted">
        <small>Data Source: dsd.go.th | Powered by Google Apps Script</small>
    </footer>
</div>

<!-- นำเข้า jQuery และ Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function() {
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzG6F_Yr4fC38D1S3QlasfhjStKOAv6U7T2JL5Jh7W8pZGY93eJULTWeOSpqabMbFZ7zQ/exec';

    $('#fetchBtn').click(function() {
        // เตรียม UI ก่อนดึงข้อมูล
        $('#loader').show();
        $('#btnText').text('กำลังโหลด...');
        $('#fetchBtn').prop('disabled', true);
        $('#courseTable tbody').empty();
        $('#noData').hide();

        $.ajax({
            url: GAS_URL,
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                if (data.error) {
                    alert('เกิดข้อผิดพลาดจาก Server: ' + data.error);
                } else {
                    parseData(data.contents);
                }
            },
            error: function() {
                alert('ไม่สามารถดึงข้อมูลได้ โปรดตรวจสอบการตั้งค่า Deployment ของ Google Apps Script');
            },
            complete: function() {
                $('#loader').hide();
                $('#btnText').text('ดึงข้อมูลล่าสุด');
                $('#fetchBtn').prop('disabled', false);
            }
        });
    });

    function parseData(htmlContent) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlContent, 'text/html');
        
        // ค้นหาแถวทั้งหมดในตาราง
        const rows = $(doc).find('table tr');
        let count = 0;

        rows.each(function() {
            const cols = $(this).find('td');
            if (cols.length >= 5) {
                // คอลัมน์สถานะมักจะอยู่คอลัมน์สุดท้าย (index ที่ 5 หรือ 6 ขึ้นอยู่กับตาราง)
                const statusText = $(cols[cols.length - 1]).text().trim();

                // กรองเฉพาะคำว่า "สมัครได้"
                if (statusText.includes("สมัครได้")) {
                    count++;
                    const courseName = $(cols[1]).text().trim();
                    const department = $(cols[2]).text().trim();
                    const duration = $(cols[3]).text().trim();

                    const rowHtml = `
                        <tr>
                            <td><strong>${count}</strong></td>
                            <td>${courseName}</td>
                            <td><span class="text-secondary small">${department}</span></td>
                            <td>${duration}</td>
                            <td><span class="status-badge">✅ ${statusText}</span></td>
                        </tr>
                    `;
                    $('#courseTable tbody').append(rowHtml);
                }
            }
        });

        if (count === 0) {
            $('#noData').html('<p class="text-danger">ไม่พบหลักสูตรที่เปิดรับสมัคร (สถานะสมัครได้) ในขณะนี้</p>').show();
        }
    }
});
</script>

</body>
</html>
