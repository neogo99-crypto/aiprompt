<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบหลักสูตรฝึกอบรม DSD (Updated)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; padding: 50px 0; }
        .main-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: #ffffff; padding: 30px; }
        .header-title { color: #0d6efd; font-weight: 600; border-left: 5px solid #0d6efd; padding-left: 15px; margin-bottom: 25px; }
        .table thead { background-color: #0d6efd; color: white; }
        .status-badge { background-color: #d1e7dd; color: #0f5132; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; display: inline-block; }
        #loader { display: none; }
        .empty-state { text-align: center; padding: 40px; color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="header-title mb-0">ค้นหาหลักสูตรที่ยังว่าง (DSD)</h2>
            <button id="fetchBtn" class="btn btn-primary btn-lg shadow-sm">
                <span id="btnText">ดึงข้อมูลล่าสุด</span>
                <div id="loader" class="spinner-border spinner-border-sm ms-2" role="status"></div>
            </button>
        </div>
        <p class="text-muted mb-4">ระบบจะกรองเฉพาะหลักสูตรที่มีสถานะ "สมัคร"</p>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="courseTable">
                <thead>
                    <tr>
                        <th width="5%">#</th>
                        <th width="40%">ชื่อหลักสูตร / สาขา</th>
                        <th width="25%">หน่วยงาน</th>
                        <th width="15%">ระยะเวลาฝึก</th>
                        <th width="15%">สถานะ</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="noData" class="empty-state">
                <p>กดปุ่ม "ดึงข้อมูลล่าสุด" เพื่อเริ่มการค้นหา</p>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzG6F_Yr4fC38D1S3QlasfhjStKOAv6U7T2JL5Jh7W8pZGY93eJULTWeOSpqabMbFZ7zQ/exec';

    $('#fetchBtn').click(function() {
        $('#loader').show();
        $('#btnText').text('กำลังโหลด...');
        $('#fetchBtn').prop('disabled', true);
        $('#courseTable tbody').empty();
        $('#noData').hide();

        $.get(GAS_URL, function(data) {
            if (data.error) {
                alert('Error: ' + data.error);
            } else {
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                const rows = $(doc).find('table tr');
                let count = 0;

                rows.each(function() {
                    const cols = $(this).find('td');
                    if (cols.length >= 5) {
                        // ดึงข้อความสถานะและลบช่องว่างออกทั้งหมดเพื่อป้องกันความผิดพลาด
                        const statusText = $(cols[cols.length - 1]).text().trim();

                        // ปรับเงื่อนไขให้เช็คแค่คำว่า "สมัคร"
                        if (statusText.includes("สมัคร")) {
                            count++;
                            $('#courseTable tbody').append(`
                                <tr>
                                    <td><strong>${count}</strong></td>
                                    <td>${$(cols[1]).text().trim()}</td>
                                    <td><span class="text-secondary small">${$(cols[2]).text().trim()}</span></td>
                                    <td>${$(cols[3]).text().trim()}</td>
                                    <td><span class="status-badge">✅ ${statusText}</span></td>
                                </tr>
                            `);
                        }
                    }
                });

                if (count === 0) {
                    $('#noData').html('<p class="text-danger">ไม่พบหลักสูตรที่สถานะ "สมัคร" ในหน้าแรก</p>').show();
                }
            }
        })
        .fail(function() { alert('การเชื่อมต่อล้มเหลว'); })
        .always(function() {
            $('#loader').hide();
            $('#btnText').text('ดึงข้อมูลล่าสุด');
            $('#fetchBtn').prop('disabled', false);
        });
    });
});
</script>

</body>
</html>
