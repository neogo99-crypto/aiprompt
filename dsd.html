<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSD Training Courses - Filtered</title>
    <!-- นำเข้า Bootstrap เพื่อความสวยงาม -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .status-available { color: #198754; font-weight: bold; }
        .loading-spinner { display: none; }
    </style>
</head>
<body>

<div class="container bg-white p-4 shadow-sm rounded">
    <h2 class="mb-4 text-primary">รายชื่อหลักสูตรที่ยังว่าง (DSD)</h2>
    
    <button id="fetchBtn" class="btn btn-primary mb-3">ดึงข้อมูลล่าสุด</button>
    <span id="loader" class="loading-spinner spinner-border spinner-border-sm text-primary"></span>

    <div class="table-responsive">
        <table class="table table-hover table-bordered" id="courseTable">
            <thead class="table-dark">
                <tr>
                    <th>ลำดับ</th>
                    <th>ชื่อหลักสูตร/สาขา</th>
                    <th>หน่วยงาน</th>
                    <th>ระยะเวลาฝึก</th>
                    <th>สถานะ</th>
                </tr>
            </thead>
            <tbody>
                <!-- ข้อมูลจะถูกเติมที่นี่ -->
            </tbody>
        </table>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#fetchBtn').click(function() {
        const targetUrl = 'https://www.dsd.go.th/DSD/Intro/ListTraining';
        // ใช้ AllOrigins Proxy เพื่อเลี่ยงปัญหา CORS
        const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

        $('#loader').show();
        $('#courseTable tbody').empty();

        $.getJSON(proxyUrl, function(data) {
            const html = data.contents;
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            // ค้นหาแถวในตารางจากหน้าเว็บ DSD (อ้างอิงตามโครงสร้างจริงของเว็บ)
            // หมายเหตุ: selector อาจต้องปรับตาม id/class จริงของหน้าเว็บนั้น
            const rows = $(doc).find('table tr'); 

            let count = 1;
            rows.each(function(index) {
                if (index === 0) return; // ข้าม header

                const cols = $(this).find('td');
                if (cols.length > 0) {
                    const statusText = $(cols[cols.length - 1]).text().trim();

                    // กรองเฉพาะ "สมัครได้" (หรือคำที่แสดงว่ายังว่าง)
                    if (statusText.includes("สมัครได้")) {
                        let rowHtml = `<tr>
                            <td>${count++}</td>
                            <td>${$(cols[1]).text().trim()}</td>
                            <td>${$(cols[2]).text().trim()}</td>
                            <td>${$(cols[3]).text().trim()}</td>
                            <td class="status-available">✅ ${statusText}</td>
                        </tr>`;
                        $('#courseTable tbody').append(rowHtml);
                    }
                }
            });
            
            $('#loader').hide();
            if (count === 1) alert('ไม่พบหลักสูตรที่เปิดรับสมัครในขณะนี้');
        }).fail(function() {
            alert('เกิดข้อผิดพลาดในการดึงข้อมูล');
            $('#loader').hide();
        });
    });
});
</script>

</body>
</html>
