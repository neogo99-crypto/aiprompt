<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Manager | Premium Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f3f4f6;
            background-image: radial-gradient(circle at top right, #e0e7ff, #f3f4f6);
            min-height: 100vh;
        }
        
        /* สไตล์สำหรับแก้วใส (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }

        /* ตกแต่งข้อความไล่สี (Gradient Text) สำหรับ Section 1 */
        .gradient-text {
            background: linear-gradient(135deg, #4F46E5 0%, #9333EA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        /* ตกแต่ง Scrollbar สำหรับ Section 2 */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #1f2937;
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-8">

    <div class="glass-card w-full max-w-4xl rounded-3xl p-8 md:p-12 transition-all duration-300">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-3 tracking-tight">Prompt <span class="text-indigo-600">Workspace</span></h1>
            <p class="text-gray-500 text-sm md:text-base">ระบบดึงข้อมูลและจัดการ Prompt แบบอัตโนมัติ</p>
        </div>

        <div class="mb-10 relative">
            <label for="promptSelector" class="block text-sm font-medium text-gray-700 mb-2">เลือกรายการที่คุณต้องการ</label>
            <div class="relative">
                <select id="promptSelector" class="block w-full pl-4 pr-10 py-4 text-base border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-lg rounded-xl shadow-sm bg-white text-gray-800 cursor-pointer appearance-none transition-all">
                    <option value="" disabled selected>กำลังโหลดข้อมูล...</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div id="contentArea" class="hidden animate-fade-in-up">
            <div class="mb-8 text-center md:text-left border-b border-gray-200 pb-6">
                <h2 id="section1" class="text-2xl md:text-4xl font-bold gradient-text drop-shadow-sm leading-tight">
                    </h2>
            </div>

            <div class="relative group">
                <label class="block text-sm font-medium text-gray-700 mb-2">รายละเอียด (Details / Prompt)</label>
                
                <textarea id="section2" readonly class="w-full h-64 md:h-80 bg-gray-900 text-gray-100 p-6 rounded-2xl shadow-inner font-mono text-sm md:text-base resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all leading-relaxed"></textarea>
                
                <button id="copyBtn" class="absolute top-10 right-4 bg-white/10 hover:bg-white/20 text-white backdrop-blur-md border border-white/20 px-4 py-2 rounded-lg flex items-center gap-2 transition-all shadow-sm">
                    <svg id="copyIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    <span id="copyText" class="font-medium">คัดลอก</span>
                </button>
            </div>
        </div>

    </div>

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
    </style>

    <script>
        // การตั้งค่า URL
        const BASE_URL = 'https://neogo99-crypto.github.io/aiprompt/txt/';
        const INDEX_URL = BASE_URL + 'index.txt';

        // อ้างอิง Elements ต่างๆ
        const promptSelector = document.getElementById('promptSelector');
        const contentArea = document.getElementById('contentArea');
        const section1 = document.getElementById('section1');
        const section2 = document.getElementById('section2');
        const copyBtn = document.getElementById('copyBtn');
        const copyIcon = document.getElementById('copyIcon');
        const copyText = document.getElementById('copyText');

        // ฟังก์ชันเมื่อเริ่มต้นทำงาน (โหลดไฟล์ index.txt)
        async function initialize() {
            try {
                const response = await fetch(INDEX_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const textData = await response.text();
                processData(textData);
            } catch (error) {
                console.error('Error:', error);
                promptSelector.innerHTML = '<option disabled selected>เกิดข้อผิดพลาดในการโหลดข้อมูล</option>';
            }
        }

        // ฟังก์ชันแยกข้อมูลและสร้าง Dropdown
        function processData(text) {
            // แยกข้อมูลทีละบรรทัด (รองรับทั้ง \n และ \r\n)
            const lines = text.split(/\r?\n/);
            
            promptSelector.innerHTML = '<option value="" disabled selected>-- คลิกเพื่อเลือกหัวข้อ --</option>';

            lines.forEach(line => {
                // ข้ามบรรทัดที่ว่างเปล่า
                if (line.trim() === '') return;

                // แบ่งข้อมูลด้วยเครื่องหมาย |
                const parts = line.split('|');
                if (parts.length >= 2) {
                    const header = parts[0].trim();
                    const detail = parts[1].trim();

                    // สร้าง option สำหรับ Dropdown
                    const option = document.createElement('option');
                    option.value = detail; // เก็บชื่อไฟล์ไว้ที่ value
                    option.textContent = header; // แสดงชื่อ Header
                    promptSelector.appendChild(option);
                }
            });
        }

        // ฟังก์ชันเมื่อผู้ใช้เปลี่ยนตัวเลือกใน Dropdown
        promptSelector.addEventListener('change', async function() {
            const selectedOption = this.options[this.selectedIndex];
            const headerText = selectedOption.textContent;
            const fileName = selectedOption.value;

            // แสดงพื้นที่ Content
            contentArea.classList.remove('hidden');
            
            // นำ Header ไปแสดงใน Section 1
            section1.textContent = headerText;

            // นำ Detail ไปแสดงใน Section 2 (ดึงข้อมูลจาก URL)
            section2.value = 'กำลังโหลดเนื้อหา...';
            
            try {
                const fileUrl = BASE_URL + fileName;
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('File not found');
                const content = await response.text();
                section2.value = content;
            } catch (error) {
                section2.value = 'ไม่พบข้อมูลหรือเกิดข้อผิดพลาดในการดึงไฟล์: ' + fileName;
            }
        });

        // ฟังก์ชันกดปุ่มคัดลอก (Copy to Clipboard)
        copyBtn.addEventListener('click', async () => {
            const textToCopy = section2.value;
            if (!textToCopy || textToCopy === 'กำลังโหลดเนื้อหา...') return;

            try {
                await navigator.clipboard.writeText(textToCopy);
                
                // เปลี่ยนสถานะปุ่มชั่วคราว
                copyIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
                copyText.textContent = 'คัดลอกแล้ว!';
                copyBtn.classList.add('bg-green-500/90', 'border-green-500', 'text-white');
                copyBtn.classList.remove('bg-white/10', 'hover:bg-white/20', 'border-white/20');

                // คืนค่าปุ่มกลับเป็นปกติใน 2 วินาที
                setTimeout(() => {
                    copyIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>';
                    copyText.textContent = 'คัดลอก';
                    copyBtn.classList.remove('bg-green-500/90', 'border-green-500', 'text-white');
                    copyBtn.classList.add('bg-white/10', 'hover:bg-white/20', 'border-white/20');
                }, 2000);
            } catch (err) {
                alert('ไม่สามารถคัดลอกข้อความได้ กรุณาลองใหม่อีกครั้ง');
            }
        });

        // เรียกใช้งานฟังก์ชันโหลดข้อมูลทันทีที่เปิดหน้าเว็บ
        initialize();
    </script>
</body>
</html>
