<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSD Course Explorer - Filter System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; padding: 20px; }
        .main-card { border: none; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); background: #ffffff; padding: 25px; }
        
        /* Filter Section Styling */
        .filter-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }

        .table-responsive {
            max-height: 70vh;
            overflow: auto;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .table { width: max-content; min-width: 100%; margin-bottom: 0; }
        .table th, .table td { white-space: nowrap; padding: 12px 20px; vertical-align: middle; }
        .table thead { background-color: #0d6efd; color: white; position: sticky; top: 0; z-index: 10; }
        
        .status-badge {
            background-color: #d1e7dd; color: #0f5132; padding: 4px 12px;
            border-radius: 50px; font-weight: 600; border: 1px solid #0f5132;
        }

        .progress-box { display: none; margin-bottom: 20px; }
        .highlight { background-color: #fff3cd; font-weight: bold; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="main-card">
        <div class="row align-items-center mb-4">
            <div class="col-lg-7">
                <h3 class="text-primary fw-bold mb-1">ระบบกรองข้อมูลหลักสูตร DSD</h3>
                <p class="text-muted small mb-0">ดึงข้อมูลทุกหน้าและค้นหาตามเงื่อนไขที่ต้องการ</p>
            </div>
            <div class="col-lg-5 text-lg-end mt-3 mt-lg-0">
                <button id="fetchBtn" class="btn btn-primary btn-lg shadow-sm px-4">
                    <span id="btnText">เริ่มดึงข้อมูลทั้งหมด</span>
                    <span id="spinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                </button>
            </div>
        </div>

        <!-- Progress UI -->
        <div class="progress-box" id="progressBox">
            <div class="d-flex justify-content-between mb-1 small fw-bold">
                <span id="statusLabel">เตรียมการ...</span>
                <span>หน้า <span id="curP">0</span> / <span id="totalP">?</span></span>
            </div>
            <div class="progress" style="height: 6px;">
                <div id="pBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
            </div>
        </div>

        <!-- Filter System UI -->
        <div class="filter-section shadow-sm">
            <div class="row g-3 align-items-center">
                <div class="col-auto">
                    <label class="fw-bold">ค้นหาจาก:</label>
                </div>
                <div class="col-md-2">
                    <select id="filterColumn" class="form-select">
                        <option value="1">ชื่อสาขา</option>
                        <option value="6">หน่วยงาน</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="text" id="filterInput" class="form-control" placeholder="พิมพ์คำที่ต้องการค้นหาที่นี่...">
                </div>
                <div class="col-auto">
                    <button id="clearFilter" class="btn btn-outline-secondary">ล้างการกรอง</button>
                </div>
                <div class="col text-end">
                    <span class="badge bg-info text-dark p-2">พบทั้งหมด <span id="matchCount">0</span> รายการ</span>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped" id="dsdTable">
                <thead>
                    <tr>
                        <th class="text-center">ลำดับ</th>
                        <th>สาขา</th>
                        <th class="text-center">ระยะเวลาที่ฝึก (ชั่วโมง)</th>
                        <th>รูปแบบ</th>
                        <th>วันเริ่ม</th>
                        <th>วันสิ้นสุด</th>
                        <th>หน่วยงาน</th>
                        <th class="text-center">สถานะ</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="emptyMsg" class="text-center p-5 text-muted">
                <p>กดยืนยันเพื่อดึงข้อมูลเข้าระบบ</p>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhcqbiLgmX-zIFm-hv2jIXNYQtxIFLLD9GBRMntc_8RI-AqG2wWudrxYa9L7IOLxk_Og/exec';
    let allDataRows = []; // เก็บข้อมูลทั้งหมดไว้ในตัวแปรเพื่อใช้กรอง

    $('#fetchBtn').click(async function() {
        allDataRows = []; 
        $('#dsdTable tbody').empty();
        $('#emptyMsg').hide();
        $('#fetchBtn').prop('disabled', true);
        $('#spinner').show();
        $('#progressBox').fadeIn();
        $('#btnText').text('กำลังประมวลผล...');

        try {
            const res = await fetch(`${GAS_URL}?page=1`);
            const data = await res.json();
            if (data.error) throw new Error(data.error);

            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');
            
            let totalPages = 1;
            $(doc).find('ul.pagination li a').each(function() {
                const p = parseInt($(this).text());
                if (!isNaN(p) && p > totalPages) totalPages = p;
            });

            const maxPages = Math.min(totalPages, 20); 
            $('#totalP').text(maxPages);

            for (let i = 1; i <= maxPages; i++) {
                $('#curP').text(i);
                $('#statusLabel').text(`ดึงข้อมูลหน้า ${i}...`);
                $('#pBar').css('width', (i / maxPages * 100) + '%');

                const pageData = (i === 1) ? data : await fetchPage(i);
                if (pageData) parseAndStore(pageData.contents);
                await new Promise(r => setTimeout(r, 200));
            }

            renderTable(allDataRows);

        } catch (err) {
            alert('Error: ' + err.message);
        } finally {
            $('#fetchBtn').prop('disabled', false);
            $('#spinner').hide();
            $('#btnText').text('อัปเดตข้อมูลใหม่');
        }
    });

    async function fetchPage(p) {
        try {
            const res = await fetch(`${GAS_URL}?page=${p}`);
            return await res.json();
        } catch (e) { return null; }
    }

    // ฟังก์ชันเก็บข้อมูลลงใน Array
    function parseAndStore(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        $(doc).find('table tr').each(function() {
            const td = $(this).find('td');
            if (td.length >= 7) {
                const status = $(td[td.length - 1]).text().trim();
                if (status.includes("สมัคร")) {
                    allDataRows.push({
                        branch: $(td[1]).text().trim(),
                        hours: $(td[2]).text().trim(),
                        type: $(td[3]).text().trim(),
                        start: $(td[4]).text().trim(),
                        end: $(td[5]).text().trim(),
                        agency: $(td[6]).text().trim(),
                        status: status
                    });
                }
            }
        });
    }

    // ฟังก์ชันวาดตารางจากข้อมูลที่กรองแล้ว
    function renderTable(dataList) {
        const tbody = $('#dsdTable tbody');
        tbody.empty();
        dataList.forEach((item, index) => {
            tbody.append(`
                <tr>
                    <td class="text-center fw-bold">${index + 1}</td>
                    <td class="fw-bold text-primary">${item.branch}</td>
                    <td class="text-center">${item.hours}</td>
                    <td>${item.type}</td>
                    <td>${item.start}</td>
                    <td>${item.end}</td>
                    <td>${item.agency}</td>
                    <td class="text-center"><span class="status-badge">✅ ${item.status}</span></td>
                </tr>
            `);
        });
        $('#matchCount').text(dataList.length);
        if (dataList.length === 0) $('#emptyMsg').show().html('<p class="text-danger">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</p>');
        else $('#emptyMsg').hide();
    }

    // ระบบกรองข้อมูล (Filter)
    $('#filterInput').on('keyup', function() {
        const val = $(this).val().toLowerCase();
        const colKey = $('#filterColumn').val() == "1" ? 'branch' : 'agency';
        
        const filtered = allDataRows.filter(item => {
            return item[colKey].toLowerCase().includes(val);
        });
        
        renderTable(filtered);
    });

    // ปุ่มล้างค่า
    $('#clearFilter').click(function() {
        $('#filterInput').val('');
        renderTable(allDataRows);
    });
});
</script>

</body>
</html>
