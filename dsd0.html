<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบดึงข้อมูลหลักสูตร DSD ทั้งหมด</title>
    
    <!-- Google Fonts & Bootstrap 5 -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f7f9;
            padding: 40px 0;
        }
        .main-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            background: #ffffff;
            padding: 30px;
        }
        .header-section {
            border-bottom: 2px solid #eef2f7;
            margin-bottom: 25px;
            padding-bottom: 15px;
        }
        .header-title {
            color: #0d6efd;
            font-weight: 600;
        }
        .status-badge {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        /* Progress Bar Styling */
        .progress {
            height: 10px;
            border-radius: 10px;
            display: none;
            margin-bottom: 20px;
        }
        #status-text {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 10px;
            display: none;
        }
        .table-responsive {
            max-height: 600px; /* เพิ่ม Scrollbar ถ้าข้อมูลเยอะ */
            overflow-y: auto;
        }
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #adb5bd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <div class="header-section d-flex justify-content-between align-items-center">
            <div>
                <h2 class="header-title">ตรวจสอบหลักสูตรว่างทั้งหมด</h2>
                <p class="text-muted mb-0">ค้นหาข้อมูลทุกหน้าจากกรมพัฒนาฝีมือแรงงาน</p>
            </div>
            <button id="fetchBtn" class="btn btn-primary btn-lg px-4 shadow-sm">
                <span id="btnText">เริ่มดึงข้อมูลทุกหน้า</span>
                <span id="spinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
            </button>
        </div>

        <!-- Progress Section -->
        <div id="status-text text-center">กำลังตรวจสอบหน้า <span id="current-page-label">0</span> จาก <span id="total-pages-label">?</span></div>
        <div class="progress">
            <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="courseTable">
                <thead class="table-light sticky-top">
                    <tr>
                        <th width="5%">#</th>
                        <th width="40%">ชื่อหลักสูตร / สาขา</th>
                        <th width="25%">หน่วยงาน</th>
                        <th width="15%">ระยะเวลาฝึก</th>
                        <th width="15%">สถานะ</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be inserted here -->
                </tbody>
            </table>
            <div id="noData" class="empty-state">
                <p>ยังไม่มีข้อมูล กดปุ่มด้านบนเพื่อเริ่มดึงข้อมูล</p>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhcqbiLgmX-zIFm-hv2jIXNYQtxIFLLD9GBRMntc_8RI-AqG2wWudrxYa9L7IOLxk_Og/exec';
    let totalFound = 0;

    $('#fetchBtn').click(async function() {
        // Reset UI
        totalFound = 0;
        $('#courseTable tbody').empty();
        $('#noData').hide();
        $('#fetchBtn').prop('disabled', true);
        $('#spinner').show();
        $('.progress').show();
        $('#status-text').show();
        $('#btnText').text('กำลังประมวลผล...');

        try {
            // 1. ดึงหน้าแรกเพื่อหาจำนวนหน้าทั้งหมด
            const firstPageData = await fetchPage(1);
            if (!firstPageData) throw new Error("ไม่สามารถติดต่อ Server ได้");

            const parser = new DOMParser();
            const doc = parser.parseFromString(firstPageData.contents, 'text/html');
            
            // หาจำนวนหน้าสูงสุดจาก Pagination (สมมติว่าดึงจากเลขสุดท้ายในรายการหน้า)
            let totalPages = 1;
            const paginationLinks = $(doc).find('ul.pagination li a');
            paginationLinks.each(function() {
                const p = parseInt($(this).text());
                if (!isNaN(p) && p > totalPages) totalPages = p;
            });

            // จำกัดการดึงข้อมูลสูงสุด (เพื่อความปลอดภัย ไม่เกิน 15 หน้า หรือปรับตามต้องการ)
            const maxPages = Math.min(totalPages, 15);
            $('#total-pages-label').text(maxPages);

            // 2. เริ่ม Loop ดึงข้อมูลทีละหน้า
            for (let i = 1; i <= maxPages; i++) {
                $('#current-page-label').text(i);
                let percent = (i / maxPages) * 100;
                $('#progress-bar').css('width', percent + '%');

                const pageData = (i === 1) ? firstPageData : await fetchPage(i);
                if (pageData) {
                    processRows(pageData.contents);
                }
                
                // ใส่ Delay เล็กน้อย 0.3 วินาที เพื่อไม่ให้ยิง Request ถี่เกินไป
                await new Promise(r => setTimeout(r, 300));
            }

            if (totalFound === 0) {
                $('#noData').html('<p class="text-danger">ไม่พบหลักสูตรที่สถานะ "สมัคร" ในทุกหน้า</p>').show();
            }

        } catch (error) {
            alert('เกิดข้อผิดพลาด: ' + error.message);
        } finally {
            $('#fetchBtn').prop('disabled', false);
            $('#spinner').hide();
            $('#btnText').text('เริ่มดึงข้อมูลอีกครั้ง');
            $('.progress-bar').removeClass('progress-bar-animated');
        }
    });

    // ฟังก์ชันดึงข้อมูลจาก GAS
    async function fetchPage(pageNumber) {
        try {
            const response = await fetch(`${GAS_URL}?page=${pageNumber}`);
            return await response.json();
        } catch (e) {
            console.error("Fetch error page " + pageNumber, e);
            return null;
        }
    }

    // ฟังก์ชันจัดการข้อมูลในตาราง
    function processRows(htmlContent) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlContent, 'text/html');
        const rows = $(doc).find('table tr');

        rows.each(function() {
            const cols = $(this).find('td');
            if (cols.length >= 5) {
                const statusText = $(cols[cols.length - 1]).text().trim();

                // ตรวจสอบเงื่อนไข "สมัคร"
                if (statusText.includes("สมัคร")) {
                    totalFound++;
                    const rowHtml = `
                        <tr>
                            <td><strong>${totalFound}</strong></td>
                            <td>${$(cols[1]).text().trim()}</td>
                            <td><span class="text-secondary small">${$(cols[2]).text().trim()}</span></td>
                            <td>${$(cols[3]).text().trim()}</td>
                            <td><span class="status-badge">✅ ${statusText}</span></td>
                        </tr>
                    `;
                    $('#courseTable tbody').append(rowHtml);
                }
            }
        });
    }
});
</script>

</body>
</html>
