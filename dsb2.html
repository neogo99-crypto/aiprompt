<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบหลักสูตร DSD (8 Columns Full Width)</title>
    
    <!-- Google Fonts & Bootstrap 5 -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .main-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            background: #ffffff;
            padding: 20px;
        }
        /* การจัดการตารางให้เลื่อนขวาได้โดยไม่ตัดบรรทัด */
        .table-responsive {
            max-height: 75vh;
            overflow: auto; /* เปิดให้เลื่อนได้ทั้ง X และ Y */
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .table {
            width: max-content; /* สำคัญ: ปล่อยให้ตารางยาวตามเนื้อหา */
            min-width: 100%;
            margin-bottom: 0;
        }
        .table th, .table td {
            white-space: nowrap; /* ห้ามตัดบรรทัดใหม่ */
            padding: 12px 20px;
            vertical-align: middle;
        }
        .table thead {
            background-color: #0d6efd;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .status-badge {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: 600;
            border: 1px solid #0f5132;
        }
        /* UI Progress */
        .progress-box {
            display: none;
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="main-card">
        <div class="row align-items-center mb-4">
            <div class="col-lg-8">
                <h3 class="text-primary fw-bold mb-1">สรุปหลักสูตรฝึกอบรมที่เปิดรับสมัคร (DSD)</h3>
                <p class="text-muted small mb-0">แสดงข้อมูลครบ 8 คอลัมน์ (สามารถเลื่อนดูไปทางขวาได้)</p>
            </div>
            <div class="col-lg-4 text-lg-end mt-3 mt-lg-0">
                <button id="fetchBtn" class="btn btn-primary btn-lg shadow-sm">
                    <span id="btnText">เริ่มดึงข้อมูลทั้งหมด</span>
                    <span id="spinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                </button>
            </div>
        </div>

        <div class="progress-box shadow-sm" id="progressBox">
            <div class="d-flex justify-content-between mb-2">
                <span id="statusLabel" class="small fw-bold">กำลังเตรียมดึงข้อมูล...</span>
                <span class="small">หน้า <span id="curP">0</span> / <span id="totalP">?</span></span>
            </div>
            <div class="progress" style="height: 6px;">
                <div id="pBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped" id="dsdTable">
                <thead>
                    <tr>
                        <th class="text-center">ลำดับ</th>
                        <th>สาขา</th>
                        <th class="text-center">ระยะเวลาที่ฝึก (ชั่วโมง)</th>
                        <th>รูปแบบ</th>
                        <th>วันเริ่ม</th>
                        <th>วันสิ้นสุด</th>
                        <th>หน่วยงาน</th>
                        <th class="text-center">สถานะ</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- ข้อมูลจะถูกเติมที่นี่ -->
                </tbody>
            </table>
            <div id="emptyMsg" class="text-center p-5 text-muted">
                <p>คลิกปุ่มเพื่อดึงข้อมูลจากกรมพัฒนาฝีมือแรงงาน</p>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhcqbiLgmX-zIFm-hv2jIXNYQtxIFLLD9GBRMntc_8RI-AqG2wWudrxYa9L7IOLxk_Og/exec';
    let totalCount = 0;

    $('#fetchBtn').click(async function() {
        totalCount = 0;
        $('#dsdTable tbody').empty();
        $('#emptyMsg').hide();
        $('#fetchBtn').prop('disabled', true);
        $('#spinner').show();
        $('#progressBox').fadeIn();
        $('#btnText').text('กำลังโหลดข้อมูล...');

        try {
            // 1. ดึงหน้าแรกเพื่อคำนวณจำนวนหน้า
            const res = await fetch(`${GAS_URL}?page=1`);
            const data = await res.json();
            if (data.error) throw new Error(data.error);

            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');
            
            let totalPages = 1;
            $(doc).find('ul.pagination li a').each(function() {
                const p = parseInt($(this).text());
                if (!isNaN(p) && p > totalPages) totalPages = p;
            });

            const maxPages = Math.min(totalPages, 20); // ดึงสูงสุด 20 หน้า
            $('#totalP').text(maxPages);

            // 2. Loop ดึงข้อมูลแต่ละหน้า
            for (let i = 1; i <= maxPages; i++) {
                $('#curP').text(i);
                $('#statusLabel').text(`กำลังดึงข้อมูลหน้า ${i}...`);
                let progress = (i / maxPages) * 100;
                $('#pBar').css('width', progress + '%');

                const pageData = (i === 1) ? data : await fetchPage(i);
                if (pageData && pageData.contents) {
                    parseRows(pageData.contents);
                }
                await new Promise(r => setTimeout(r, 200));
            }

        } catch (err) {
            alert('เกิดข้อผิดพลาด: ' + err.message);
        } finally {
            $('#fetchBtn').prop('disabled', false);
            $('#spinner').hide();
            $('#btnText').text('ดึงข้อมูลอีกครั้ง');
            $('#statusLabel').text('ดึงข้อมูลเสร็จสมบูรณ์');
        }
    });

    async function fetchPage(p) {
        try {
            const res = await fetch(`${GAS_URL}?page=${p}`);
            return await res.json();
        } catch (e) { return null; }
    }

    function parseRows(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const rows = $(doc).find('table tr');

        rows.each(function() {
            const td = $(this).find('td');
            // ตรวจสอบว่ามีคอลัมน์เพียงพอ (โครงสร้าง 8 คอลัมน์)
            if (td.length >= 7) {
                const status = $(td[td.length - 1]).text().trim();

                if (status.includes("สมัคร")) {
                    totalCount++;
                    
                    // ดึงข้อมูลตามลำดับ 1-8
                    const branch = $(td[1]).text().trim();      // 2. สาขา
                    const hours = $(td[2]).text().trim();       // 3. ระยะเวลา (ชั่วโมง)
                    const type = $(td[3]).text().trim();        // 4. รูปแบบ
                    const dateStart = $(td[4]).text().trim();   // 5. วันเริ่ม
                    const dateEnd = $(td[5]).text().trim();     // 6. วันสิ้นสุด
                    const agency = $(td[6]).text().trim();      // 7. หน่วยงาน

                    $('#dsdTable tbody').append(`
                        <tr>
                            <td class="text-center fw-bold">${totalCount}</td>
                            <td class="fw-bold text-primary">${branch}</td>
                            <td class="text-center">${hours}</td>
                            <td>${type}</td>
                            <td>${dateStart}</td>
                            <td>${dateEnd}</td>
                            <td>${agency}</td>
                            <td class="text-center"><span class="status-badge">✅ ${status}</span></td>
                        </tr>
                    `);
                }
            }
        });
    }
});
</script>

</body>
</html>
