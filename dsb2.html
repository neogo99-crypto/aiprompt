<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบหลักสูตร DSD แบบละเอียด</title>
    
    <!-- Google Fonts (Sarabun) & Bootstrap 5 -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8f9fa;
            padding: 30px 0;
        }
        .main-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            background: #ffffff;
            padding: 25px;
        }
        .header-title {
            color: #0b5ed7;
            font-weight: 600;
            margin-bottom: 5px;
        }
        /* Table Styling */
        .table {
            font-size: 0.95rem;
        }
        .table thead {
            background-color: #0b5ed7;
            color: white;
            white-space: nowrap;
        }
        .table-responsive {
            max-height: 700px;
            overflow-y: auto;
            border-radius: 10px;
        }
        .status-badge {
            background-color: #e9f7ef;
            color: #198754;
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid #198754;
        }
        /* Progress UI */
        .progress-container {
            display: none;
            margin: 20px 0;
            background: #eef2f7;
            padding: 15px;
            border-radius: 10px;
        }
        #status-info {
            font-size: 0.85rem;
            color: #495057;
            margin-bottom: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #adb5bd;
        }
        .sticky-top {
            top: -1px;
            z-index: 1020;
        }
    </style>
</head>
<body>

<div class="container-fluid px-4">
    <div class="main-card">
        <div class="row align-items-center mb-4">
            <div class="col-md-8">
                <h2 class="header-title">ระบบสรุปหลักสูตรฝึกอบรมที่เปิดรับสมัคร</h2>
                <p class="text-muted small mb-0">ดึงข้อมูลครบทุกหน้าและจัดเรียงตามโครงสร้างกรมพัฒนาฝีมือแรงงาน</p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <button id="fetchBtn" class="btn btn-primary btn-lg shadow-sm px-4">
                    <span id="btnText">ดึงข้อมูลทุกหน้า</span>
                    <span id="spinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                </button>
            </div>
        </div>

        <!-- แถบแสดงสถานะการโหลด -->
        <div class="progress-container shadow-sm">
            <div id="status-info" class="d-flex justify-content-between">
                <span>กำลังประมวลผลข้อมูล...</span>
                <span>หน้า <span id="curPage">0</span> / <span id="totalPage">?</span></span>
            </div>
            <div class="progress" style="height: 8px;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
            </div>
        </div>

        <div class="table-responsive border">
            <table class="table table-hover table-striped mb-0" id="mainTable">
                <thead class="sticky-top">
                    <tr>
                        <th class="text-center">ลำดับ</th>
                        <th>สาขา</th>
                        <th class="text-center">ระยะเวลาที่ฝึก (ชม.)</th>
                        <th>วันเริ่ม</th>
                        <th>วันสิ้นสุด</th>
                        <th>หน่วยงาน</th>
                        <th class="text-center">สถานะ</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- ข้อมูลจะถูกเติมที่นี่ -->
                </tbody>
            </table>
            <div id="noData" class="empty-state">
                <p>ยังไม่มีข้อมูลในตาราง กรุณากดปุ่ม "ดึงข้อมูลทุกหน้า"</p>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhcqbiLgmX-zIFm-hv2jIXNYQtxIFLLD9GBRMntc_8RI-AqG2wWudrxYa9L7IOLxk_Og/exec';
    let totalFound = 0;

    $('#fetchBtn').click(async function() {
        // ล้างค่าเดิมและตั้งค่า UI
        totalFound = 0;
        $('#mainTable tbody').empty();
        $('#noData').hide();
        $('#fetchBtn').prop('disabled', true);
        $('#spinner').show();
        $('.progress-container').fadeIn();
        $('#btnText').text('กำลังโหลด...');

        try {
            // 1. ดึงหน้าแรกก่อนเพื่อเช็คจำนวนหน้าทั้งหมด
            const response = await fetch(`${GAS_URL}?page=1`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');
            
            // หาจำนวนหน้าทั้งหมดจากเมนู Pagination
            let totalPages = 1;
            $(doc).find('ul.pagination li a').each(function() {
                const p = parseInt($(this).text());
                if (!isNaN(p) && p > totalPages) totalPages = p;
            });

            // จำกัดการดึงสูงสุดเพื่อป้องกัน Time out (สามารถปรับเพิ่มได้)
            const maxPages = Math.min(totalPages, 20);
            $('#totalPage').text(maxPages);

            // 2. Loop ดึงข้อมูลแต่ละหน้า
            for (let i = 1; i <= maxPages; i++) {
                $('#curPage').text(i);
                let progress = (i / maxPages) * 100;
                $('#progressBar').css('width', progress + '%');

                // หน้าแรกมีข้อมูลแล้ว ไม่ต้อง fetch ซ้ำ
                const pageData = (i === 1) ? data : await fetchPage(i);
                if (pageData && pageData.contents) {
                    renderRows(pageData.contents);
                }
                
                // รอเล็กน้อยให้ Browser ไม่ค้าง
                await new Promise(r => setTimeout(r, 200));
            }

        } catch (err) {
            alert('เกิดข้อผิดพลาด: ' + err.message);
        } finally {
            $('#fetchBtn').prop('disabled', false);
            $('#spinner').hide();
            $('#btnText').text('ดึงข้อมูลอีกครั้ง');
            if (totalFound === 0) $('#noData').show();
        }
    });

    async function fetchPage(p) {
        try {
            const res = await fetch(`${GAS_URL}?page=${p}`);
            return await res.json();
        } catch (e) { return null; }
    }

    function renderRows(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const rows = $(doc).find('table tr');

        rows.each(function() {
            const td = $(this).find('td');
            // ตรวจสอบว่ามีคอลัมน์เพียงพอ (ปกติหน้าเว็บนี้จะมีประมาณ 7-8 คอลัมน์ใน HTML)
            if (td.length >= 7) {
                // ดึงค่าสถานะมาเช็คก่อน (มักอยู่คอลัมน์สุดท้าย)
                const status = $(td[td.length - 1]).text().trim();

                if (status.includes("สมัคร")) {
                    totalFound++;
                    
                    // Mapping ข้อมูลตามลำดับที่ต้องการ
                    const branch = $(td[1]).text().trim();      // สาขา
                    const hours = $(td[2]).text().trim();       // ชั่วโมง
                    const dateStart = $(td[3]).text().trim();   // วันเริ่ม
                    const dateEnd = $(td[4]).text().trim();     // วันสิ้นสุด
                    const agency = $(td[5]).text().trim();      // หน่วยงาน

                    const rowHtml = `
                        <tr>
                            <td class="text-center font-monospace">${totalFound}</td>
                            <td class="fw-bold text-primary">${branch}</td>
                            <td class="text-center">${hours}</td>
                            <td>${dateStart}</td>
                            <td>${dateEnd}</td>
                            <td class="small text-muted">${agency}</td>
                            <td class="text-center"><span class="status-badge">✅ ${status}</span></td>
                        </tr>
                    `;
                    $('#mainTable tbody').append(rowHtml);
                }
            }
        });
    }
});
</script>

</body>
</html>
