<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lithium-ion Battery Pack Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        select, input[type="range"] { cursor: pointer; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col h-2/5 md:h-full z-10 shadow-md">
        <div class="p-4 border-b border-gray-200 flex items-center gap-2">
            <div class="text-blue-600 text-xl font-bold">
                <svg class="w-6 h-6 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <h1 class="text-md font-semibold text-gray-750">Lithium-ion Battery Pack</h1>
        </div>

        <div class="flex border-b border-gray-200 text-sm">
            <button class="w-1/2 py-2.5 text-center font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50/30">Control</button>
            <button class="w-1/2 py-2.5 text-center font-medium text-gray-500 hover:text-gray-700">Enables</button>
        </div>

        <div class="flex-1 p-5 space-y-5 overflow-y-auto">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cell Shape</label>
                <select id="cellShape" class="w-full bg-gray-50 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm text-gray-900 focus:outline-none focus:border-blue-500">
                    <option value="cylindrical">Cylindrical</option>
                    <option value="prismatic">Prismatic Block</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Battery Chemistry</label>
                <select id="cellChemistry" class="w-full bg-gray-50 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm text-gray-900 focus:outline-none focus:border-blue-500">
                    <option value="nmc">NMC (3.7V / Cell)</option>
                    <option value="lfp">LFP (3.2V / Cell)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cell Capacity (Ah)</label>
                <input id="cellCapacity" type="number" value="5.0" step="0.5" class="w-full bg-gray-50 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm text-gray-900 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <div class="flex justify-between text-sm font-medium text-gray-700 mb-1">
                    <span>Series (S)</span>
                    <span id="sValDisplay" class="font-semibold text-gray-900 bg-gray-100 px-2 py-0.5 rounded text-xs">4</span>
                </div>
                <input id="seriesCount" type="range" min="1" max="16" value="4" class="w-full accent-blue-600">
            </div>

            <div>
                <div class="flex justify-between text-sm font-medium text-gray-700 mb-1">
                    <span>Parallel (P)</span>
                    <span id="pValDisplay" class="font-semibold text-gray-900 bg-gray-100 px-2 py-0.5 rounded text-xs">2</span>
                </div>
                <input id="parallelCount" type="range" min="1" max="10" value="2" class="w-full accent-blue-600">
            </div>

            <div class="flex items-center justify-between pt-2">
                <span class="text-sm font-medium text-gray-700">BMS System</span>
                <div class="flex items-center gap-2">
                    <span id="bmsStatusText" class="text-xs text-gray-500">On</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input id="toggleBMS" type="checkbox" checked class="sr-only peer">
                        <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500"></div>
                    </label>
                </div>
            </div>
        </div>

        <div class="p-5 border-t border-gray-200 bg-gray-50/80">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Calculated Output:</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <span class="text-xs text-gray-400 block">Output Voltage</span>
                    <span id="totalVoltage" class="text-xl font-bold text-gray-800">14.8V</span>
                </div>
                <div>
                    <span class="text-xs text-gray-400 block">Output Capacity</span>
                    <span id="totalCapacity" class="text-xl font-bold text-gray-800">10.0Ah</span>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 relative h-3/5 md:h-full bg-white">
        <div id="canvasContainer" class="w-full h-full"></div>

        <div class="absolute top-4 right-4 bg-white/80 border border-gray-200 shadow-sm p-2 rounded text-[11px] text-gray-500 pointer-events-none">
            <p>🖱️ คลิกซ้ายค้าง = หมุนมองรอบทิศทาง</p>
            <p>🖱️ คลิกขวาค้าง = ย้ายจุดศูนย์กลางกล้อง</p>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let mainBatteryGroup = new THREE.Group();
        const container = document.getElementById('canvasContainer');

        // ฟังก์ชันสร้างฉาก 3 มิติเริ่มต้น
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); // พื้นหลังขาวนวลคล้ายในภาพตัวอย่าง

            camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(12, 10, 15); // ตั้งมุมมองเฉียงสูงลงมาให้เห็นชัดเจน

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // จัดการระบบแสงสว่างสตูดิโอให้เห็นสีสันวัตถุที่สมจริง
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(10, 18, 12);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            scene.add(mainLight);

            // ใส่แผ่นตาราง Grid บางๆ เพื่อความสวยงามแบบในโปรแกรม CAD
            const gridHelper = new THREE.GridHelper(30, 30, 0xe2e8f0, 0xf1f5f9);
            gridHelper.position.y = -2.0;
            scene.add(gridHelper);

            // สร้างครอบโปร่งแสงใส (Acrylic Box) ล้อมรอบตัวแพ็ค เพื่อเพิ่มความลึกมิติและดูเป็นมืออาชีพ
            const boxFrameGeo = new THREE.BoxGeometry(7, 3.5, 5);
            const boxFrameMat = new THREE.MeshStandardMaterial({ 
                color: 0xcccccc, 
                transparent: true, 
                opacity: 0.08, 
                wireframe: false,
                roughness: 0.1
            });
            const outerBox = new THREE.Mesh(boxFrameGeo, boxFrameMat);
            outerBox.position.set(0, 0, 0);
            scene.add(outerBox);

            scene.add(mainBatteryGroup);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // ฟังก์ชันหัวใจหลักในการคำนวณวงจรไฟฟ้าและถักทอบัสบาร์/สาย BMS ลงโมเดลตามตำแหน่งที่เปลี่ยนไป
        function rebuildBatteryPack() {
            // ดึงค่า Input ล่าสุดจาก UI ฝั่งซ้าย
            const shape = document.getElementById('cellShape').value;
            const chemistry = document.getElementById('cellChemistry').value;
            const cellCap = parseFloat(document.getElementById('cellCapacity').value) || 5.0;
            const sCount = parseInt(document.getElementById('seriesCount').value) || 1;
            const pCount = parseInt(document.getElementById('parallelCount').value) || 1;
            const showBMS = document.getElementById('toggleBMS').checked;

            // ปรับตัวเลขแสดงผลบนสไลเดอร์
            document.getElementById('sValDisplay').innerText = sCount;
            document.getElementById('pValDisplay').innerText = pCount;
            document.getElementById('bmsStatusText').innerText = showBMS ? "On" : "Off";

            // คำนวณสูตรทางฟิสิกส์ไฟฟ้า (V และ Ah รวม)
            const cellNominalV = chemistry === 'nmc' ? 3.7 : 3.2;
            const calcV = cellNominalV * sCount;
            const calcAh = cellCap * pCount;

            document.getElementById('totalVoltage').innerText = calcV.toFixed(1) + "V";
            document.getElementById('totalCapacity').innerText = calcAh.toFixed(1) + "Ah";

            // ลบโมเดลเก่าทิ้งเพื่อวาดโมเดลใหม่ให้อยู่ในหน่วยความจำที่ปลอดภัย
            while(mainBatteryGroup.children.length > 0) {
                mainBatteryGroup.remove(mainBatteryGroup.children[0]);
            }

            // คำจำกัดความวัสดุและสีพื้นฐาน (สีเปลือกแบต, ขั้วบวกสีแดง, ขั้วลบสีดำ/เทาเข้ม)
            const wrapperMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 }); // สีน้ำเงินแบบตัวอย่าง
            const posTerminalMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 }); // สีแดง (+)
            const negTerminalMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.2 }); // สีดำเข้ม (-)
            const nickelBarMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.9, roughness: 0.1 }); // สีทองแดงเงาแวววาวตามภาพตัวอย่าง

            // ระยะความกว้างและระยะห่างของแต่ละเซลล์
            let radius = 0.5, height = 2.4;
            let stepX = 1.2, stepZ = 1.2;

            // คลังเก็บพิกัดขั้วเพื่อใช้ลากโครงข่ายสาย Balance และบัสบาร์
            let cellMatrix = [];

            // 1. วาดก้อนเซลล์แบตเตอรี่ (Cell Matrix Grid Setup)
            for(let s = 0; s < sCount; s++) {
                cellMatrix[s] = [];
                // สลับขั้วไฟฟ้าบวก/ลบระหว่างชุดอนุกรม (Alternating Polarity Standard สำหรับงานวิศวกรรม)
                const isRowFlipped = (s % 2 === 1);

                for(let p = 0; p < pCount; p++) {
                    const singleCellGroup = new THREE.Group();

                    // ส่วนบอดี้หลักตัวถังแบต
                    let cellGeometry;
                    if(shape === 'cylindrical') {
                        cellGeometry = new THREE.CylinderGeometry(radius, radius, height, 32);
                    } else {
                        cellGeometry = new THREE.BoxGeometry(1.0, height, 0.7);
                    }
                    const bodyMesh = new THREE.Mesh(cellGeometry, wrapperMat);
                    bodyMesh.castShadow = true;
                    bodyMesh.receiveShadow = true;
                    singleCellGroup.add(bodyMesh);

                    // สร้างฝาปิดหัวขั้วไฟฟ้า (Terminal Rings)
                    const ringGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.05, 16);
                    const posCap = new THREE.Mesh(ringGeometry, posTerminalMat);
                    const negCap = new THREE.Mesh(ringGeometry, negTerminalMat);

                    // วางตำแหน่งขั้วบวกขั้วลบ แยกพิกัดออกจากกันชัดเจนเพื่อง่ายต่อการมองเห็นแนวบัสบาร์
                    if(!isRowFlipped) {
                        posCap.position.set(0, height/2 + 0.025, 0.25);
                        negCap.position.set(0, height/2 + 0.025, -0.25);
                    } else {
                        posCap.position.set(0, height/2 + 0.025, -0.25);
                        negCap.position.set(0, height/2 + 0.025, 0.25);
                    }

                    singleCellGroup.add(posCap);
                    singleCellGroup.add(negCap);

                    // หาพิกัดศูนย์กลางการจัดวางโดยอ้างอิงให้ชุดแพ็คอยู่ตรงกลางหน้าจอพอดี
                    const posX = (s * stepX) - ((sCount - 1) * stepX) / 2;
                    const posZ = (p * stepZ) - ((pCount - 1) * stepZ) / 2;
                    singleCellGroup.position.set(posX, 0, posZ);

                    mainBatteryGroup.add(singleCellGroup);

                    // บันทึกตำแหน่งขั้วลงอาร์เรย์พิกัด 3 มิติเพื่อไปใช้วาดบัสบาร์
                    cellMatrix[s][p] = {
                        globalPos: new THREE.Vector3(posX, height/2 + 0.05, posZ),
                        posTerminalLocal: new THREE.Vector3(posX, height/2 + 0.05, posZ + (isRowFlipped ? -0.25 : 0.25)),
                        negTerminalLocal: new THREE.Vector3(posX, height/2 + 0.05, posZ + (isRowFlipped ? 0.25 : -0.25))
                    };
                }
            }

            // 2. สร้างเส้นทางเชื่อมต่อแผ่นนิกเกิล/บัสบาร์แบบขนาน (Parallel Connection Busbar)
            for(let s = 0; s < sCount; s++) {
                if(pCount > 1) {
                    const firstCell = cellMatrix[s][0];
                    const lastCell = cellMatrix[s][pCount-1];
                    const barLength = Math.abs(lastCell.globalPos.z - firstCell.globalPos.z) + 0.2;

                    // บัสบาร์ขนานฝั่งขั้วบวก
                    const pBarGeo = new THREE.BoxGeometry(0.18, 0.04, barLength);
                    const pBarMesh = new THREE.Mesh(pBarGeo, nickelBarMat);
                    pBarMesh.position.set(firstCell.posTerminalLocal.x, firstCell.posTerminalLocal.y + 0.02, (firstCell.posTerminalLocal.z + lastCell.posTerminalLocal.z)/2);
                    mainBatteryGroup.add(pBarMesh);

                    // บัสบาร์ขนานฝั่งขั้วลบ
                    const nBarGeo = new THREE.BoxGeometry(0.18, 0.04, barLength);
                    const nBarMesh = new THREE.Mesh(nBarGeo, nickelBarMat);
                    nBarMesh.position.set(firstCell.negTerminalLocal.x, firstCell.negTerminalLocal.y + 0.02, (firstCell.negTerminalLocal.z + lastCell.negTerminalLocal.z)/2);
                    mainBatteryGroup.add(nBarMesh);
                }
            }

            // 3. สร้างแผ่นบัสบาร์ทองแดงเชื่อมระหว่างชุดอนุกรม (Series Bridge Busbar)
            for(let s = 0; s < sCount - 1; s++) {
                const currentSBlock = cellMatrix[s];
                const nextSBlock = cellMatrix[s+1];

                // ลากสะพานไฟเชื่อมจาก ขั้วลบของกลุ่มปัจจุบัน ไปยัง ขั้วบวกของกลุ่มถัดไป เพื่อทำการ Series แรงดันไฟฟ้า
                const bridgeStart = currentSBlock[0].negTerminalLocal;
                const bridgeEnd = nextSBlock[0].posTerminalLocal;

                // ตรวจสอบระยะกว้างครอบคลุมจำนวนขนานทั้งหมด
                const bridgeWidth = pCount > 1 ? (pCount - 1) * stepZ + 0.4 : 0.4;
                const bridgeGeo = new THREE.BoxGeometry(stepX, 0.04, bridgeWidth);
                const seriesBridgeMesh = new THREE.Mesh(bridgeGeo, nickelBarMat);

                seriesBridgeMesh.position.set((bridgeStart.x + bridgeEnd.x)/2, bridgeStart.y + 0.04, (bridgeStart.z + bridgeEnd.z)/2);
                mainBatteryGroup.add(seriesBridgeMesh);
            }

            // 4. ลากขั้วสายไฟ Output ออกมาภายนอกขอบตัวแพ็คให้เห็นเด่นชัดเพื่อนำไปใช้งานต่อ (เหมือนในภาพสเก็ตช์ตัวอย่าง)
            const mainPositiveCorner = cellMatrix[0][0].posTerminalLocal;
            const mainNegativeCorner = cellMatrix[sCount-1][pCount-1].negTerminalLocal;

            // สายไฟขั้วบวกหลักสีแดง (Main Battery Pack Output Leads +)
            const posCableGroup = new THREE.Group();
            const cableLength = 2.5;
            const cableGeo = new THREE.CylinderGeometry(0.08, 0.08, cableLength, 16);
            cableGeo.rotateZ(Math.PI / 2); // หมุนให้นอนพุ่งออกจากแบตเตอรี่

            const posCableMesh = new THREE.Mesh(cableGeo, posTerminalMat);
            posCableMesh.position.set(cableLength/2, 0, 0);
            posCableGroup.add(posCableMesh);

            // หางปลาขั้วต่อปลายสาย (Metal Lug interface ring)
            const lugGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.03, 16);
            const lugMesh = new THREE.Mesh(lugGeo, nickelBarMat);
            lugMesh.position.set(cableLength, 0, 0);
            posCableGroup.add(lugMesh);

            posCableGroup.position.set(mainPositiveCorner.x, mainPositiveCorner.y + 0.1, mainPositiveCorner.z + 0.5);
            mainBatteryGroup.add(posCableGroup);

            // สายไฟขั้วลบหลักสีดำ (Main Battery Pack Output Leads -)
            const negCableGroup = new THREE.Group();
            const negCableMesh = new THREE.Mesh(cableGeo, negTerminalMat);
            negCableMesh.position.set(-cableLength/2, 0, 0);
            negCableGroup.add(negCableMesh);

            const lugNegMesh = new THREE.Mesh(lugGeo, nickelBarMat);
            lugNegMesh.position.set(-cableLength, 0, 0);
            negCableGroup.add(lugNegMesh);

            negCableGroup.position.set(mainNegativeCorner.x, mainNegativeCorner.y + 0.1, mainNegativeCorner.z - 0.5);
            mainBatteryGroup.add(negCableGroup);


            // 5. ระบบจำลองการเชื่อมต่อสายไฟระบบจัดสรรบาลานซ์เซลล์ (BMS Balance Harness Simulation Map)
            if(showBMS) {
                // สร้างแผงวงจรบอร์ดควบคุม BMS ปริ้นท์สีเขียวเข้มจำลองเกาะอยู่ด้านข้างของชุดแบตเตอรี่
                const pcbGeo = new THREE.BoxGeometry(1.6, 0.1, 2.0);
                const pcbMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.5 }); // สีเขียวแผ่น PCB แบบในรูปภาพ
                const bmsBoardMesh = new THREE.Mesh(pcbGeo, pcbMat);
                
                // จัดตำแหน่งให้ลอยอยู่บริเวณตรงกลางด้านหน้าแถวแพ็ค
                bmsBoardMesh.position.set(0, -0.2, ((pCount - 1) * stepZ) / 2 + 1.2);
                mainBatteryGroup.add(bmsBoardMesh);

                // ชิปไอซีไมโครคอนโทรลเลอร์สีดำประทับตราอักษรบนแผ่นบอร์ด
                const icGeo = new THREE.BoxGeometry(0.6, 0.08, 0.6);
                const icMesh = new THREE.Mesh(icGeo, negTerminalMat);
                icMesh.position.set(0, 0.06, 0);
                bmsBoardMesh.add(icMesh);

                // เริ่มกระบวนการลากเส้นจำลองสาย Balance Leads: B-, B0, B1, B2... จนถึง B+ เข้าสู่เซลล์ตามลำดับวิศวกรรมจริง
                const colorsHarness = [0x27272a, 0xd97706, 0x2563eb, 0xdc2626]; // ดำ (B-), ส้ม (B1), น้ำเงิน (B2), แดง (B+)
                
                for(let b = 0; b <= sCount; b++) {
                    let targetPoint;
                    if(b === 0) {
                        targetPoint = cellMatrix[0][0].negTerminalLocal; // จุดต่อสาย B- เข้าขั้วลบแรกสุดสัมบูรณ์
                    } else {
                        targetPoint = cellMatrix[b-1][0].posTerminalLocal; // จุดบาลานซ์ลำดับอนุกรมถัดๆ ไป (B1, B2... B+)
                    }

                    // จุดต้นทางออกจากขั้วสล็อตพินบนบอร์ด BMS
                    const startPoint = new THREE.Vector3(
                        bmsBoardMesh.position.x + (b * 0.15) - (sCount * 0.075), 
                        bmsBoardMesh.position.y + 0.05, 
                        bmsBoardMesh.position.z
                    );

                    // ดัดโค้งเส้นทางเดินสายเพื่อความสวยงามสมจริงแบบธรรมชาติไม่ให้สายตึงเป็นเส้นตรงทื่อๆ
                    const midPoint = new THREE.Vector3((startPoint.x + targetPoint.x)/2, targetPoint.y + 0.5, (startPoint.z + targetPoint.z)/2);
                    
                    const wireCurvePath = new THREE.CatmullRomCurve3([startPoint, midPoint, targetPoint]);
                    const wireGeometry = new THREE.TubeGeometry(wireCurvePath, 24, 0.025, 8, false);
                    
                    const selectedColor = colorsHarness[b % colorsHarness.length];
                    const wireMaterial = new THREE.MeshStandardMaterial({ color: selectedColor, roughness: 0.6 });
                    const singleWireMesh = new THREE.Mesh(wireGeometry, wireMaterial);
                    
                    mainBatteryGroup.add(singleWireMesh);
                }
            }
        }

        // จัดการผูกตัวตรวจจับความเคลื่อนไหวข้อมูล (Event Triggers) เข้ากับ UI Components ทั้งหมด
        document.getElementById('cellShape').addEventListener('change', rebuildBatteryPack);
        document.getElementById('cellChemistry').addEventListener('change', rebuildBatteryPack);
        document.getElementById('cellCapacity').addEventListener('input', rebuildBatteryPack);
        document.getElementById('seriesCount').addEventListener('input', rebuildBatteryPack);
        document.getElementById('parallelCount').addEventListener('input', rebuildBatteryPack);
        document.getElementById('toggleBMS').addEventListener('change', rebuildBatteryPack);

        // รันคำสั่งเปิดเครื่องทำงานทันที
        init3D();
        rebuildBatteryPack();
    </script>
</body>
</html>
