<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional 3D Battery Pack Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        canvas { display: block; }
        .control-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row text-slate-200">

    <div class="w-full md:w-96 control-panel border-r border-slate-700 flex flex-col h-2/5 md:h-full z-10">
        <div class="p-6 border-b border-slate-700">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="text-amber-500">⚡</span> Battery Builder 3D
            </h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Engineering Edition</p>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="space-y-4">
                <h2 class="text-xs font-bold text-amber-500 uppercase">1. Cell Specifications</h2>
                <div>
                    <label class="block text-sm mb-1 text-slate-400">รูปทรง (Cell Shape)</label>
                    <select id="cellShape" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm focus:border-amber-500 outline-none">
                        <option value="cylindrical">ทรงกระบอก (Cylindrical 18650)</option>
                        <option value="prismatic">สี่เหลี่ยม (Prismatic Studs)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-400">ชนิด (Chemistry)</label>
                        <select id="cellChem" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm">
                            <option value="nmc">NMC (3.7V)</option>
                            <option value="lfp">LFP (3.2V)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-400">ความจุ (Ah)</label>
                        <input id="cellCapacity" type="number" value="5" step="0.1" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm">
                    </div>
                </div>
            </div>

            <div class="space-y-4 pt-4 border-t border-slate-700">
                <h2 class="text-xs font-bold text-amber-500 uppercase">2. Pack Configuration</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-400">Series (S)</label>
                        <input id="sCount" type="number" value="4" min="1" max="24" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-400">Parallel (P)</label>
                        <input id="pCount" type="number" value="2" min="1" max="10" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm">
                    </div>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-700">
                <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg">
                    <div>
                        <p class="text-sm font-semibold">แสดงระบบ BMS</p>
                        <p class="text-[10px] text-slate-500">B-, B0, B1... B+ Wiring</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input id="showBMS" type="checkbox" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-amber-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                    </label>
                </div>
            </div>

            <button id="updateBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl transition-all shadow-lg shadow-amber-500/20">
                ประมวลผลโมเดล 3 มิติ
            </button>
        </div>

        <div class="p-6 bg-slate-900/80 border-t border-slate-700">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <p class="text-[10px] text-slate-400 uppercase">แรงดันรวม</p>
                    <p id="resV" class="text-xl font-bold text-white mono">14.8V</p>
                </div>
                <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <p class="text-[10px] text-slate-400 uppercase">ความจุรวม</p>
                    <p id="resAh" class="text-xl font-bold text-white mono">10.0Ah</p>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 relative bg-slate-950">
        <div id="canvas-container" class="w-full h-full"></div>
        
        <div class="absolute bottom-6 left-6 flex gap-4 p-4 bg-slate-900/80 rounded-xl border border-slate-700 text-[10px] pointer-events-none">
            <div class="flex items-center gap-2"><span class="w-3 h-3 bg-red-500 rounded-sm"></span> ขั้วบวก (+)</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 bg-slate-600 rounded-sm"></span> ขั้วลบ (-)</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 bg-amber-400 rounded-sm"></span> Nickel/Busbar</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 bg-blue-500 rounded-sm"></span> BMS Wiring</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let batteryPackGroup = new THREE.Group();
        const container = document.getElementById('canvas-container');

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(12, 10, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);
            const directional = new THREE.DirectionalLight(0xffffff, 1);
            directional.position.set(10, 20, 10);
            directional.castShadow = true;
            scene.add(directional);

            // Grid
            const grid = new THREE.GridHelper(30, 30, 0x1e293b, 0x0f172a);
            grid.position.y = -2.5;
            scene.add(grid);

            scene.add(batteryPackGroup);

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function buildModel() {
            // Get Values
            const shape = document.getElementById('cellShape').value;
            const chem = document.getElementById('cellChem').value;
            const cap = parseFloat(document.getElementById('cellCapacity').value);
            const s = parseInt(document.getElementById('sCount').value);
            const p = parseInt(document.getElementById('pCount').value);
            const showBMS = document.getElementById('showBMS').checked;

            // Calculations
            const nominalV = chem === 'nmc' ? 3.7 : 3.2;
            document.getElementById('resV').innerText = (s * nominalV).toFixed(1) + "V";
            document.getElementById('resAh').innerText = (p * cap).toFixed(1) + "Ah";

            // Clear Old Model
            while(batteryPackGroup.children.length > 0) batteryPackGroup.remove(batteryPackGroup.children[0]);

            // Constants
            const cellColor = chem === 'nmc' ? 0x2563eb : 0x0d9488;
            const h = 2.5;
            const spacingX = shape === 'cylindrical' ? 1.2 : 1.6;
            const spacingZ = shape === 'cylindrical' ? 1.2 : 1.0;
            const offsetX = (s - 1) * spacingX / 2;
            const offsetZ = (p - 1) * spacingZ / 2;

            const cellMat = new THREE.MeshStandardMaterial({ color: cellColor, roughness: 0.5 });
            const posMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const negMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8, roughness: 0.2 });
            const busbarMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8 });
            const wireMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });

            let connectionPoints = [];

            // 1. Create Cells
            for(let si = 0; si < s; si++) {
                connectionPoints[si] = { pos: [], neg: [] };
                
                // Professional Pack logic: To make series connection easy, 
                // we often flip every second row physically.
                const rowFlipped = (si % 2 === 1); 

                for(let pi = 0; pi < p; pi++) {
                    const group = new THREE.Group();
                    
                    // Main Body
                    let bodyGeo;
                    if(shape === 'cylindrical') {
                        bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, h, 32);
                    } else {
                        bodyGeo = new THREE.BoxGeometry(1.4, h, 0.7);
                    }
                    const body = new THREE.Mesh(bodyGeo, cellMat);
                    group.add(body);

                    // Terminals
                    if(shape === 'cylindrical') {
                        // Cylindrical: Pos Top (Red), Neg Bottom (Gray)
                        const topGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
                        const topCap = new THREE.Mesh(topGeo, rowFlipped ? negMat : posMat);
                        topCap.position.y = h/2 + 0.05;
                        group.add(topCap);

                        const botGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.05, 32);
                        const botCap = new THREE.Mesh(botGeo, rowFlipped ? posMat : negMat);
                        botCap.position.y = -h/2 - 0.025;
                        group.add(botCap);

                        connectionPoints[si].pos.push(new THREE.Vector3(si * spacingX - offsetX, (rowFlipped ? -h/2 - 0.1 : h/2 + 0.1), pi * spacingZ - offsetZ));
                        connectionPoints[si].neg.push(new THREE.Vector3(si * spacingX - offsetX, (rowFlipped ? h/2 + 0.1 : -h/2 - 0.1), pi * spacingZ - offsetZ));
                    } else {
                        // Prismatic: Screw terminals on top, far apart
                        const studGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.3, 16);
                        const nutGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 6);
                        
                        const studP = new THREE.Mesh(studGeo, posMat);
                        const nutP = new THREE.Mesh(nutGeo, metalMat);
                        nutP.position.y = 0.15;
                        studP.add(nutP);
                        
                        const studN = new THREE.Mesh(studGeo, negMat);
                        const nutN = new THREE.Mesh(nutGeo, metalMat);
                        nutN.position.y = 0.15;
                        studN.add(nutN);

                        // Position studs far apart on top
                        if(!rowFlipped) {
                            studP.position.set(0.45, h/2 + 0.15, 0);
                            studN.position.set(-0.45, h/2 + 0.15, 0);
                        } else {
                            studP.position.set(-0.45, h/2 + 0.15, 0);
                            studN.position.set(0.45, h/2 + 0.15, 0);
                        }
                        
                        group.add(studP);
                        group.add(studN);

                        connectionPoints[si].pos.push(new THREE.Vector3(si * spacingX - offsetX + studP.position.x, h/2 + 0.3, pi * spacingZ - offsetZ));
                        connectionPoints[si].neg.push(new THREE.Vector3(si * spacingX - offsetX + studN.position.x, h/2 + 0.3, pi * spacingZ - offsetZ));
                    }

                    group.position.set(si * spacingX - offsetX, 0, pi * spacingZ - offsetZ);
                    batteryPackGroup.add(group);
                }
            }

            // 2. Parallel Nickel Strips / Busbars
            for(let si = 0; si < s; si++) {
                if(p > 1) {
                    const firstP = connectionPoints[si].pos[0];
                    const lastP = connectionPoints[si].pos[p-1];
                    const firstN = connectionPoints[si].neg[0];
                    const lastN = connectionPoints[si].neg[p-1];

                    // Parallel Busbar (Positive side)
                    const pBar = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, Math.abs(lastP.z - firstP.z) + 0.5), busbarMat);
                    pBar.position.set(firstP.x, firstP.y, (firstP.z + lastP.z)/2);
                    batteryPackGroup.add(pBar);

                    // Parallel Busbar (Negative side)
                    const nBar = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, Math.abs(lastN.z - firstN.z) + 0.5), busbarMat);
                    nBar.position.set(firstN.x, firstN.y, (firstN.z + lastN.z)/2);
                    batteryPackGroup.add(nBar);
                }
            }

            // 3. Series Bridges
            for(let si = 0; si < s - 1; si++) {
                // Bridge Negative of block Si to Positive of block Si+1
                const start = connectionPoints[si].neg[0];
                const end = connectionPoints[si+1].pos[0];
                
                const bridgeWidth = p * spacingZ;
                const bridge = new THREE.Mesh(new THREE.BoxGeometry(spacingX, 0.05, bridgeWidth), busbarMat);
                bridge.position.set((start.x + end.x)/2, (start.y + end.y)/2 + 0.05, 0);
                batteryPackGroup.add(bridge);
            }

            // 4. Output Leads
            const leadGeo = new THREE.CylinderGeometry(0.12, 0.12, 5, 16);
            leadGeo.rotateZ(Math.PI/2);
            
            // Main Pos (+)
            const mainPos = connectionPoints[0].pos[0];
            const posCable = new THREE.Mesh(leadGeo, posMat);
            posCable.position.set(mainPos.x - 2.5, mainPos.y + 0.2, 0);
            batteryPackGroup.add(posCable);
            
            // Main Neg (-)
            const mainNeg = connectionPoints[s-1].neg[0];
            const negCable = new THREE.Mesh(leadGeo, negMat);
            negCable.position.set(mainNeg.x + 2.5, mainNeg.y + 0.2, 0);
            batteryPackGroup.add(negCable);

            // 5. BMS Balance Wiring
            if(showBMS) {
                // Draw a simple BMS PCB Plate
                const pcb = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 4), new THREE.MeshStandardMaterial({color: 0x1e3a8a}));
                pcb.position.set(0, h + 1.5, -offsetZ - 3.5);
                batteryPackGroup.add(pcb);

                // Wiring from PCB to each series junction
                for(let bi = 0; bi <= s; bi++) {
                    const startPos = new THREE.Vector3((bi - s/2) * 0.3, h + 1.5, -offsetZ - 3.5);
                    let target;
                    
                    if(bi === 0) target = connectionPoints[0].neg[0]; // B-
                    else target = connectionPoints[bi-1].pos[0]; // B1, B2... B+

                    const curve = new THREE.CatmullRomCurve3([
                        startPos,
                        new THREE.Vector3(startPos.x, h + 1, startPos.z + 1),
                        new THREE.Vector3(target.x, h + 1, target.z),
                        target
                    ]);
                    
                    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.03, 8, false), wireMat);
                    batteryPackGroup.add(tube);
                    
                    // Small node at connection
                    const node = new THREE.Mesh(new THREE.SphereGeometry(0.1), wireMat);
                    node.position.copy(target);
                    batteryPackGroup.add(node);
                }
            }
        }

        document.getElementById('updateBtn').addEventListener('click', buildModel);
        
        init3D();
        buildModel();
    </script>
</body>
</html>
