<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battery Pack Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<style>html,body{margin:0;height:100%;background:#020617;color:#fff}#view{height:100vh}</style>
</head>
<body class="bg-slate-950">
<div class="flex h-screen">
<div class="w-80 p-4 bg-white/10 backdrop-blur">
<h1 class="text-xl font-bold mb-3">Battery Pack Simulator</h1>
<label>Shape</label><select id="shape" class="w-full text-black"><option>Cylindrical</option><option>Prismatic</option></select>
<label>Chemistry</label><select id="chem" class="w-full text-black"><option>NMC</option><option>LFP</option></select>
<label>Cell Ah</label><input id="ah" type="number" value="5" class="w-full text-black">
<label>Series</label><input id="s" type="number" value="8" class="w-full text-black">
<label>Parallel</label><input id="p" type="number" value="4" class="w-full text-black">
<button onclick="build()" class="mt-3 px-3 py-2 bg-blue-600 rounded">Generate Pack</button>
<div id="dash" class="mt-4 text-sm"></div>
</div>
<div id="view" class="flex-1"></div>
</div>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020617);
const cam=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,1000);
cam.position.set(15,15,20);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(window.innerWidth-320,window.innerHeight);
document.getElementById("view").appendChild(ren.domElement);
const ctl=new THREE.OrbitControls(cam,ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));
const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,10,7);scene.add(dl);
let grp=new THREE.Group();scene.add(grp);
function calc(){
 let S=+s.value,P=+p.value,Ah=+ah.value;
 let c=chem.value=="NMC"?{mx:4.2,n:3.7,mn:3}:{mx:3.65,n:3.2,mn:2.5};
 dash.innerHTML=`Max ${(S*c.mx).toFixed(2)}V<br>Nominal ${(S*c.n).toFixed(2)}V<br>Min ${(S*c.mn).toFixed(2)}V<br>Capacity ${(P*Ah).toFixed(1)}Ah`;
}
function build(){
 while(grp.children.length)grp.remove(grp.children[0]);
 calc();
 let S=+s.value,P=+p.value;
 for(let i=0;i<S;i++){
  for(let j=0;j<P;j++){
   let m;
   if(shape.value=="Cylindrical"){
    m=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,2,24),new THREE.MeshStandardMaterial({color:0x4b5563}));
    m.rotation.z=Math.PI/2;
   }else{
    m=new THREE.Mesh(new THREE.BoxGeometry(1,.6,2),new THREE.MeshStandardMaterial({color:0x64748b}));
   }
   m.position.set(i*1.4,0,j*2.3);
   grp.add(m);
  }
 }
 grp.position.x=-S*.7;
}
build();
window.addEventListener("resize",()=>{cam.aspect=(window.innerWidth-320)/window.innerHeight;cam.updateProjectionMatrix();ren.setSize(window.innerWidth-320,window.innerHeight);});
(function ani(){requestAnimationFrame(ani);ctl.update();ren.render(scene,cam);})();
</script>
</body></html>
